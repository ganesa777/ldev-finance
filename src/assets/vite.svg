<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradien Latar Belakang Kaca Sky -->
    <linearGradient id="bgGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    
    <!-- Gradien Dompet/Simbol 3D -->
    <linearGradient id="walletGrad" x1="128" y1="128" x2="384" y2="384" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Drop Shadow Elegan -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0369A1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Latar Belakang Kotak Lengkung (App Icon Style) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Kilau Cahaya Kaca Atas -->
  <path d="M64 116C64 87.2812 87.2812 64 116 64H396C424.719 64 448 87.2812 448 116V200C290 200 178 240 64 320V116Z" fill="white" fill-opacity="0.25" />

  <!-- Ikon Dompet / Wallet LDEV -->
  <g filter="url(#shadow)">
    <path d="M128 176C128 158.327 142.327 144 160 144H352C369.673 144 384 158.327 384 176V336C384 353.673 369.673 368 352 368H160C142.327 368 128 353.673 128 336V176Z" fill="url(#walletGrad)" />
    
    <!-- Garis Lipatan Dompet / Penutup -->
    <path d="M280 256H384V304H280C266.745 304 256 293.255 256 280C256 266.745 266.745 256 280 256Z" fill="#0F2A43" fill-opacity="0.85" />
    
    <!-- Tombol Emas / Kilau Keuangan di Dompet -->
    <circle cx="320" cy="280" r="16" fill="#38BDF8" />
  </g>
</svg>